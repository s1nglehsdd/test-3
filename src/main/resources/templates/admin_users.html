<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список пользователей</title>
</head>
<body>
<h1>Список пользователей</h1>

<div th:if="${param.error eq 'cannot_edit_own_balance'}">
    <p style="color: red;">Ошибка: Администратор не может изменять свой собственный баланс.</p>
</div>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Баланс</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.getId()}"></td>
        <td th:text="${user.getName()}"></td>
        <td th:text="${user.getEmail()}"></td>
        <td th:if="${!user.getRoles().isEmpty() && user.getRoles().iterator().next().getBalance() != null}" th:text="${user.getRoles().iterator().next().getBalance()}"></td>
        <td th:unless="${!user.getRoles().isEmpty() && user.getRoles().iterator().next().getBalance() != null}">Нет баланса</td>
        <td>
            <form th:action="@{/admin/users/edit_balance}" method="post">
                <input type="hidden" name="id" th:value="${user.getId()}"/>
                <label for="balance">Баланс:</label>
                <input type="number" id="balance" name="balance" size="10"
                       th:value="${!user.getRoles().isEmpty() && user.getRoles().iterator().next().getBalance() != null ? user.getRoles().iterator().next().getBalance() : 0}"/>
                <button type="submit">Сохранить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<ul>
    <li><a th:href="@{/admin}">Панель админа</a></li>
</ul>
</body>
</html>
